[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Forward API calls to the backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://chandweb.onrender.com/api/:splat"
  status = 200
  force = true

# Let React Router handle client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
